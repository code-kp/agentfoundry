[project]
name = "agentfoundry"
version = "0.1.0"
description = "Reusable agent platform runtime, API factory, and CLI tooling."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "google-adk>=1.18.0",
  "litellm>=1.0.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "tomli>=2.0.1; python_version < '3.11'",
  "pytest>=8.3.5",
  "coverage>=7.6.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_foundry*", "core*", "services*"]
exclude = ["tests*"]
namespaces = true

[project.scripts]
hey = "agent_foundry.cli.hey:main"
foundry-new-agent = "agent_foundry.cli.new_agent:main"
foundry-sync-embeddings = "agent_foundry.cli.sync_embeddings:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
